version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (and the tag comments with them).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # @types/vscode must track engines.vscode (^1.90.0) so vsce package does not fail.
    # @types/node must track the Node runtime bundled in VS Code (Node 20 for VS Code 1.90).
    ignore:
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
