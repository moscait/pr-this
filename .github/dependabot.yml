version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (and the tag comments with them).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
