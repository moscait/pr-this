name: Release

# Push a tag such as v0.3.0 (matching "version" in package.json) to build, test, package, publish to the
# VS Code Marketplace (Trusted Publishing, no token), and attach the .vsix to a GitHub release. See RELEASING.md.

on:
  push:
    tags:
      - 'v*'

# Nothing by default; each job asks for only what it needs.
permissions: {}

# Never run two releases of the same tag at once (the Marketplace rejects a version published twice).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Installs dependencies (whose install scripts run here) and tests, with no way to publish anything.
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to commit SHAs (tag in comment); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version (npm version <x.y.z> --no-git-tag-version), commit, and tag v<x.y.z>."
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section."
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vsce package

      # Only carries the .vsix to the publish job; one day keeps it out of the organization's shared storage quota.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ./*.vsix
          if-no-files-found: error
          retention-days: 1

  # Holds the publishing rights, so it runs no project code and no dependency install scripts: it installs vsce from
  # the lockfile with scripts off (signing, the only part that needs one, is not used) and publishes the tested .vsix.
  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # Marketplace Trusted Publishing: GitHub's OIDC token proves this run is the one the publisher allows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: release

      # Trusted Publishing: no stored token. The Marketplace accepts this run because the moscait publisher has a
      # policy for moscait/pr-this and .github/workflows/release.yml, and hands vsce a credential valid for 15 minutes.
      - name: Publish to VS Code Marketplace
        run: npx vsce publish --oidc --packagePath release/*.vsix

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.vsix --title "$TAG" --generate-notes || gh release upload "$TAG" release/*.vsix --clobber
