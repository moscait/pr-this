<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="grad" x1="16" y1="16" x2="112" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer rounded background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0f172a" stroke="url(#grad)" stroke-width="3" />
  
  <!-- Magnifying glass / Lens ring -->
  <circle cx="56" cy="56" r="30" stroke="url(#grad)" stroke-width="7" stroke-linecap="round" fill="none" filter="url(#glow)" />
  <line x1="78" y1="78" x2="104" y2="104" stroke="url(#grad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Git commit & diff lines inside lens -->
  <circle cx="44" cy="56" r="5" fill="#38bdf8" />
  <circle cx="68" cy="56" r="5" fill="#a855f7" />
  <line x1="49" y1="56" x2="63" y2="56" stroke="#e2e8f0" stroke-width="2.5" stroke-dasharray="3 2" />
  
  <!-- Zoom sparkle -->
  <path d="M56 36 L58 43 L65 45 L58 47 L56 54 L54 47 L47 45 L54 43 Z" fill="#38bdf8" />
</svg>

